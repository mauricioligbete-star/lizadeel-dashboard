<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIZADEEL - Tableau de bord</title>
  <!-- Framework CSS Tailwind pour un design moderne -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- En-tête -->
    <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">LIZADEEL RDC</h1>
        <p class="text-sm text-slate-5-00">Suivi synthétique des cas d'agression par province</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
        <span class="text-xs font-semibold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">Supabase DB Connectée</span>
      </div>
    </header>

    <!-- Tableau de Synthèse -->
    <main class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-6 border-b border-slate-100 flex justify-between items-center">
        <h2 class="text-lg font-semibold text-slate-800">Vue par Province</h2>
        <button onclick="fetchDashboard()" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition-colors">
          🔄 Actualiser
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-600 font-medium border-b border-slate-200">
            <tr>
              <th class="p-4">Code</th>
              <th class="p-4">Province</th>
              <th class="p-4">Total Cas</th>
              <th class="p-4">Signalés</th>
              <th class="p-4">En Cours</th>
              <th class="p-4">En Justice</th>
            </tr>
          </thead>
          <tbody id="data-table" class="divide-y divide-slate-100">
            <tr>
              <td colspan="6" class="p-8 text-center text-slate-400">Chargement des données en cours...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

  </div>

  <script>
    // Configuration de votre projet Supabase
    const SUPABASE_URL = 'https://nmjrhcglphajaxsmxhkm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tanJoY2dscGhhamF4c214aGttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMDAwMzEsImV4cCI6MjEwMjU3NjAzMX0._Xsri3_jUJcH8XfRGEr256VtnNz3ay-_RnW2_vljqh4'; // <-- REMPLACEZ PAR VOTRE CLÉ ANON

    // Initialisation du client Supabase sur le schéma 'lizadeel'
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      db: { schema: 'lizadeel' }
    });

    // Fonction d'extraction des données de la vue
    async function fetchDashboard() {
      const tbody = document.getElementById('data-table');
      
      try {
        const { data, error } = await client
          .from('v_dashboard_cases_by_province')
          .select('*');

        if (error) throw error;

        if (!data || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500">Aucune donnée trouvée.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map(row => `
          <tr class="hover:bg-slate-50/80 transition-colors">
            <td class="p-4 font-mono text-xs font-semibold text-slate-500">${row.province_code || '-'}</td>
            <td class="p-4 font-semibold text-slate-800">${row.province_name}</td>
            <td class="p-4">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200">
                ${row.total_cases}
              </span>
            </td>
            <td class="p-4 text-slate-600">${row.open_cases || 0}</td>
            <td class="p-4">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200">
                ${row.in_progress_cases || 0}
              </span>
            </td>
            <td class="p-4 text-slate-600">${row.court_cases || 0}</td>
          </tr>
        `).join('');

      } catch (err) {
        console.error('Erreur Supabase:', err);
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="p-6 text-center text-red-500 bg-red-50">
              ❌ Erreur lors du chargement : ${err.message || 'Problème de connexion'}
            </td>
          </tr>`;
      }
    }

    // Chargement automatique à l'ouverture
    fetchDashboard();
  </script>
</body>
</html>
